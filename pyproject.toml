[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bt1modern"
version = "0.3.0"
description = "Auditable BT-1 detector-bank to GSAS conversion"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
bt1convert = "bt1modern.cli:main"

[tool.setuptools]
packages = ["bt1modern"]

